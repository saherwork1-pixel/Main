<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Weather Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Inter font and full viewport height */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            /* Dark Blue to Black Gradient for Professional Look */
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #e2e8f0; /* Default light text color for contrast */
        }
        /* Custom card styling for consistent hover effect across all generated cards */
        .weather-card {
            /* Stronger, darker shadow */
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); 
            transition: all 0.4s ease-in-out;
        }
        .weather-card:hover {
            transform: translateY(-5px); /* Lift card slightly */
            box-shadow: 0 12px 25px rgba(0,0,0,0.6);
        }
    </style>
</head>

<body class="flex flex-col items-center p-8">

    <h1 class="text-4xl font-extrabold text-sky-300 mb-12 border-b-2 border-sky-500/50 pb-2">
        Abu Dhabi Marina Weather & Location Tracker
    </h1>

    <!-- Container for multiple weather cards (Responsive Grid) -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl w-full mb-12">
        <!-- Loading indicator will be replaced by cards -->
        <div id="loading-indicator" class="col-span-full text-center text-xl text-gray-400 p-8">
            <svg class="animate-spin h-6 w-6 mr-3 inline-block text-sky-400" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Loading real-time data for all marinas...
        </div>
    </div>
    
    <!-- Professional Map Section -->
    <h2 class="text-3xl font-bold text-gray-200 mb-6 mt-6">Marina Location Map</h2>
    <div class="w-full max-w-7xl rounded-xl overflow-hidden shadow-2xl border-4 border-sky-900/50">
        <!-- Using a search query with coordinates (Name@lat,lon) for high precision -->
        <iframe
            src="https://maps.google.com/maps?q=Royal+M+Marina@24.447700,54.337994,Yas+Island+Marina@24.467729,54.609596,Saadiyat+Island+Marina@24.560394,54.459160,Emirates+Palace+Marina@24.4839,54.6033,Al-Dar+Marina,+Abu+Dhabi&output=embed"
            width="100%" height="500" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
    <!-- End Map Section -->

    <script>
        // API Key
        // ----------------------------------------------------------------------
        // API Key is now set.
        // ----------------------------------------------------------------------
        const apiKey = "7b38140838b1439b33dd60ab51488528";

        // Define multiple locations by their precise Latitude and Longitude.
        // Note: 'Al-Dar Marina' now uses null coordinates to test the name-based fallback.
        const locations = [
            { name: "Royal M Marina", lat: 24.447700, lon: 54.337994 },
            { name: "Yas Island Marina", lat: 24.467729, lon: 54.609596 },
            { name: "Saadiyat Island Marina", lat: 24.560394, lon: 54.459160 },
            { name: "Qasr Al-Emarat Marina", lat: 24.4839, lon: 54.6033 },
            { name: "Al-Dar Marina", lat: 24.453231, lon: 54.338079 },
        ];

        const container = document.getElementById("cards-container");
        const loadingIndicator = document.getElementById("loading-indicator");

        // Function to create the HTML string for a single weather card
        function createCardHtml(locationData) {
            const { name, temp, desc, icon, windKmh, humidity } = locationData;

            return `
                <div id="card-${name.replace(/\s/g, '-')}" class="weather-card p-6 bg-gray-900 rounded-xl border border-sky-800">
                    
                    <!-- Marina Name (Highlighted) -->
                    <h2 class="text-3xl font-extrabold text-sky-400 mb-2">${name}</h2>
                    
                    <!-- Weather Icon -->
                    <div class="flex justify-center items-center my-4">
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="Weather Icon" class="w-24 h-24 filter drop-shadow-lg">
                    </div>

                    <!-- Temperature -->
                    <div class="text-7xl font-black text-sky-200 mb-2">${temp}°C</div>
                    
                    <!-- Description -->
                    <div class="text-xl font-medium text-gray-400 capitalize mb-6">${desc}</div>

                    <!-- Details Section (Wind Speed & Humidity) -->
                    <div class="flex justify-around text-center border-t pt-4 border-gray-700">
                        
                        <!-- Wind Speed -->
                        <div class="flex flex-col items-center">
                            <svg class="w-7 h-7 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <span class="text-sm font-semibold text-gray-400 mt-1">Wind Speed</span>
                            <span class="text-xl font-bold text-sky-300 mt-0.5">${windKmh} km/h</span>
                        </div>
                        
                        <!-- Humidity -->
                        <div class="flex flex-col items-center">
                            <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v5m-2 2h4M9 14h6m-3-3l-2 1m0 0l-2-1m2 1v5m-2 2h4"></path></svg>
                            <span class="text-sm font-semibold text-gray-400 mt-1">Humidity</span>
                            <span class="text-xl font-bold text-emerald-300 mt-0.5">${humidity}%</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Function to handle showing the error state for a specific card (Dark theme version)
        function createErrorCardHtml(name, message) {
            return `
                <div class="p-6 bg-red-900/30 rounded-xl border border-red-700 shadow-xl text-center">
                    <h2 class="text-2xl font-bold text-red-300 mb-2">${name}</h2>
                    <p class="text-sm text-red-400">${message || "Error loading data."}</p>
                    <p class="text-xs text-red-500 mt-2">Verify API key or network connection.</p>
                </div>
            `;
        }

        // Fetches data for a single location and renders the card
        async function getWeather(location) {
            if (apiKey.length < 5) {
                return createErrorCardHtml(location.name, "API Key is missing or invalid.");
            }
            
            let apiUrl;

            // Check if coordinates are available for high precision (Scenario 1)
            if (location.lat && location.lon) {
                apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${location.lat}&lon=${location.lon}&units=metric&appid=${apiKey}`;
            } 
            
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (response.status !== 200) {
                    console.error(`API Error for ${location.name}:`, data.message);
                    return createErrorCardHtml(location.name, data.message || "Invalid API key or failed lookup by name/coords.");
                }

                // 1. Data Conversion and Calculation
                const windKmh = (data.wind.speed * 3.6).toFixed(1); // m/s to km/h

                // 2. Prepare Data Structure
                const locationData = {
                    // Always use the name from the 'locations' array to ensure the marina name is shown
                    name: location.name,
                    temp: Math.round(data.main.temp),
                    desc: data.weather[0].description,
                    icon: data.weather[0].icon,
                    windKmh: windKmh,
                    humidity: data.main.humidity,
                };

                // 3. Render Card
                return createCardHtml(locationData);
            } catch (error) {
                console.error(`Fetch failed for ${location.name}:`, error);
                return createErrorCardHtml(location.name, "Network connection failed.");
            }
        }

        // Main function to load all weather data concurrently
        async function loadAllWeather() {
            // Wait for all weather fetch calls to complete
            const cardPromises = locations.map(location => getWeather(location));
            const cardHtmlResults = await Promise.all(cardPromises);

            // Remove the loading indicator
            loadingIndicator.remove();

            // Join all the generated HTML cards and inject them into the container
            container.innerHTML = cardHtmlResults.join('');
        }

        loadAllWeather();
    </script>
</body>

</html>
